services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oncotwin
      POSTGRES_PASSWORD: oncotwin
      POSTGRES_DB: oncotwin
    ports: ["5432:5432"]
    volumes: ["oncotwin_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: oncotwin
      MINIO_ROOT_PASSWORD: oncotwin-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["oncotwin_minio:/data"]
volumes:
  oncotwin_pg:
  oncotwin_minio:
