[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncotwin-api"
version = "0.1.0"
description = "OncoTwin patient-state and ingestion API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24",
  "Pillow>=10.4",
  "pytesseract>=0.3.13",
  "PyJWT[crypto]>=2.9",
  "celery>=5.4",
  "redis>=5.0",
  "boto3>=1.35",
  "openai>=1.60",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
